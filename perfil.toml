# Perfil usado para filtrar e ranquear as vagas.
# Pesos: quanto maior, mais a habilidade conta quando aparece na vaga.

[busca]
termos = [
    "desenvolvedor junior",
    "desenvolvedor jr",
    "programador junior",
    "desenvolvedor full stack junior",
    "desenvolvedor back end junior",
    "desenvolvedor front end junior",
    "analista de sistemas junior",
    "engenheiro de software junior",
]
# Vaga publicada há mais dias que isso é ignorada (quando o portal informa a data).
dias = 30

[filtro]
# Contratos aceitos. Vaga sem contrato informado passa e aparece como "não informado".
contratos = ["CLT"]
# Presencial ou híbrido só nestas cidades. Remoto passa de qualquer lugar.
cidades = ["Belo Horizonte", "Contagem", "Betim", "Nova Lima", "Sabará", "Santa Luzia", "Vespasiano", "Lagoa Santa", "Ribeirão das Neves", "Ibirité", "São José da Lapa", "Pedro Leopoldo", "Confins", "Sarzedo", "Igarapé", "Brumadinho", "Esmeraldas", "Caeté", "Raposos", "Rio Acima", "Matozinhos", "Mário Campos", "Juatuba", "Mateus Leme"]
# O título precisa ter um destes termos para contar como vaga de TI.
area = ["desenvolvedor", "desenvolvedora", "programador", "programadora", "dev", "developer", "software", "full stack", "fullstack", "back end", "back-end", "backend", "front end", "front-end", "frontend", "analista de sistemas", "analista desenvolvedor", "engenheiro de dados", "analista de dados", "engenharia de software", "desenvolvimento de sistemas", "desenvolvimento de software", "tecnico em desenvolvimento"]

[habilidades]
# Sinônimos separados por "|". O primeiro nome é o que aparece no painel.
javascript = 3
typescript = 3
"node.js|nodejs|node" = 3
"react|react.js|reactjs" = 3
python = 3
java = 3
"spring boot|spring" = 3
sql = 2
"postgresql|postgres" = 2
redis = 1
docker = 2
fastapi = 2
"api rest|apis rest|rest api|restful" = 2
json = 1
"webhook|webhooks" = 2
git = 1
html = 1
css = 1
playwright = 1
pytest = 1
dbt = 1
cloudflare = 1
vercel = 1
