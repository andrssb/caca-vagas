name: Coleta diária

on:
  schedule:
    - cron: "0 10 * * *" # 7h em Brasília
  workflow_dispatch:

concurrency:
  group: coleta
  cancel-in-progress: false

jobs:
  coletar:
    # Ligado pela variável do repositório COLETA_ATIVA=true, depois de cadastrar os segredos do Cloudflare.
    if: vars.COLETA_ATIVA == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - run: pytest -q
      # O Programathor bloqueia os IPs do GitHub (403); ele é coletado pelo coletar-diario.bat.
      - run: python -m caca_vagas coletar --fontes gupy,solides,infojobs --saida vagas.sql
      - name: Publicar no D1
        working-directory: web
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@4.149.0 d1 execute caca-vagas --remote --file ../vagas.sql -y
      # Depois da publicação, para o e-mail já contar as vagas descobertas hoje.
      - name: Enviar alertas por e-mail
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          SMTP_USUARIO: ${{ secrets.SMTP_USUARIO }}
          SMTP_SENHA: ${{ secrets.SMTP_SENHA }}
        run: python -m caca_vagas alertas
      # Por último: falha a execução (e o GitHub avisa por e-mail) se um portal parou de trazer vagas.
      - name: Conferir fontes
        if: always()
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: python -m caca_vagas conferir
